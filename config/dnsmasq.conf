# ------------------------------------
# NETWORK + INTERFACE
# ------------------------------------
interface=enp0s31f6
bind-interfaces

# DHCP range for PXE clients
dhcp-range=192.168.1.170,192.168.1.200,12h

# ------------------------------------
# TFTP ROOT (matches your script)
# ------------------------------------
enable-tftp
tftp-root=/var/lib/tftpboot

# ------------------------------------
# ARCHITECTURE DETECTION
# ------------------------------------
# UEFI x86_64 = arch 7
dhcp-match=set:UEFI,option:client-arch,7

# Detect when already inside iPXE (Option 175)
dhcp-match=set:ipxe,175

# ------------------------------------
# BOOTLOADERS (avoid duplicate keyword errors)
# ------------------------------------

# 1️⃣ iPXE stage → return HTTP boot script
dhcp-boot=tag:ipxe,http://192.168.1.160:8080/ipxe/boot.ipxe

# 2️⃣ UEFI clients → shim → GRUB
dhcp-boot=tag:UEFI,grub/bootx64.efi

# 3️⃣ BIOS clients → PXELINUX
dhcp-boot=tag:!UEFI,bios/pxelinux.0

# ------------------------------------
# NETWORK OPTIONS
# ------------------------------------
dhcp-option=3,192.168.1.1     # gateway
dhcp-option=6,192.168.1.1     # DNS

# ------------------------------------
# LOGGING
# ------------------------------------
log-dhcp
log-queries
log-facility=/var/log/dnsmasq.log

