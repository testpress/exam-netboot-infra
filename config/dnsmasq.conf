interface=enp0s31f6
bind-interfaces

# ==========================
# DHCP RANGE
# ==========================
dhcp-range=192.168.1.170,192.168.1.200,12h

# ==========================
# BOOTLOADERS
# ==========================

# Detect UEFI 64-bit clients (arch code 7)
dhcp-match=set:efi64,option:client-arch,7

# UEFI → shim → grub
dhcp-boot=tag:efi64,grub/bootx64.efi

# BIOS → pxelinux (must be tagged !efi64 to avoid keyword conflict)
dhcp-boot=tag:!efi64,bios/pxelinux.0

# ==========================
# TFTP SERVICE
# ==========================
enable-tftp
tftp-root=/var/lib/tftpboot

# ==========================
# NETWORK SETTINGS
# ==========================
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.1

# ==========================
# LOGGING
# ==========================
log-dhcp
log-queries
log-facility=/var/log/dnsmasq.log

