# -----------------------------
# NETWORK + INTERFACE
# -----------------------------
interface=eth0
bind-interfaces

# DHCP range for PXE clients
dhcp-range=192.168.1.50,192.168.1.250,12h

# -----------------------------
# TFTP (for initial PXE boot)
# -----------------------------
enable-tftp
tftp-root=/srv/tftp

# -----------------------------
# PXE / iPXE BOOT LOGIC
# -----------------------------

# Detect UEFI clients (arch 7 = x86_64 UEFI)
dhcp-match=set:UEFI,option:client-arch,7

# UEFI: deliver ipxe.efi
dhcp-boot=tag:UEFI,ipxe.efi

# BIOS: deliver undionly.kpxe
dhcp-boot=tag:!UEFI,undionly.kpxe

# Detect when we are already inside iPXE (option 175)
dhcp-match=set:ipxe,175

# When iPXE calls DHCP → return HTTP boot script
dhcp-boot=tag:ipxe,http://10.0.0.1:9000/ipxe/boot.ipxe

# -----------------------------
# LOGGING (debug friendly)
# -----------------------------
log-dhcp

