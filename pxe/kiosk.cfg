# =============================
# PORTEUS KIOSK EXAM CONFIG
# =============================

# Boot directly into browser
browser=firefox

# Exam URL
homepage=https://lmsdemo.testpress.in

# Do not allow browsing anywhere else
allow-navigation=false

# Fullscreen mode
fullscreen=yes

# Disable context menus
disable-right-click=yes

# Disable address bar
disable-address-bar=yes

# No browser exit allowed
disable-browser-exit=yes

# Disable downloads
disable-downloads=yes

# Disable printing
disable-printing=yes

# Disable file dialogs
disable-file-dialogs=yes

# No terminal or console access
disable-vt-switching=yes
block-devices=yes
disable-cli=yes

# No password saving
disable-save-passwords=yes

# No notifications
disable-browser-notifications=yes

# Disable browser extensions
disable-browser-extensions=yes

# Idle timeout (optional) – restart browser every 30 min
idle-reset-time=30

# Auto-restart browser if crashed
watchdog=yes

# Disable the escape hatch
lockdown=yes

# Don't sleep or suspend
disable-suspend=yes

# Force kiosk mode behavior
kiosk-mode=yes

# Hide mouse after inactivity
hide-mouse-pointer=8

